<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Design — Annie Koo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="site-header">
  <a class="brand" href="illustration.html">Annie Koo</a>

  <nav class="nav" aria-label="Main navigation">
    <a href="illustration.html">Illustration</a>
    <a class="active" href="design.html">Design</a>
    <a href="books.html">Books</a>
    <a href="contact.html">About / Contact</a>

    <a class="social linkedin" href="https://www.linkedin.com/in/annie-koo-587b91424" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">in</a>
    <a class="social instagram" href="https://www.instagram.com/anniessance?stkn=NTc4MTIwNjQ2YQ%3D%3D&utm_source=qr" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3.2" y="3.2" width="17.6" height="17.6" rx="4.5"
              fill="none" stroke="currentColor" stroke-width="1.8"/>
        <circle cx="12" cy="12" r="4.1"
                fill="none" stroke="currentColor" stroke-width="1.8"/>
        <circle cx="17.4" cy="6.8" r="1.05" fill="currentColor"/>
      </svg>
    </a>
  </nav>
</header>

<main>
  <section class="design-page" aria-label="Design portfolio">
    <div class="design-slider-grid">
      <div class="design-slider" data-slider tabindex="0" aria-roledescription="carousel" aria-label="DM logo design images">
        <button class="design-slider-arrow design-slider-prev" type="button" aria-label="Previous image">‹</button>

        <div class="design-slider-viewport">
          <div class="design-slide is-active" data-slide aria-hidden="false">
            <img src="assets/dm-logo-final.jpeg" alt="DM logo final design">
          </div>
          <div class="design-slide" data-slide aria-hidden="true">
            <img src="assets/dm-logo-sketches.jpeg" alt="DM logo development sketches">
          </div>
        </div>

        <button class="design-slider-arrow design-slider-next" type="button" aria-label="Next image">›</button>

        <div class="design-slider-dots" aria-label="Choose DM logo slide">
          <button class="design-slider-dot is-active" type="button" aria-label="Show slide 1" aria-current="true"></button>
          <button class="design-slider-dot" type="button" aria-label="Show slide 2" aria-current="false"></button>
        </div>
      </div>

      <div class="design-slider" data-slider tabindex="0" aria-roledescription="carousel" aria-label="JRC logo and shirt design images">
        <button class="design-slider-arrow design-slider-prev" type="button" aria-label="Previous image">‹</button>

        <div class="design-slider-viewport">
          <div class="design-slide is-active" data-slide aria-hidden="false">
            <img src="assets/jrc-logo.png" alt="JRC logo design">
          </div>
          <div class="design-slide" data-slide aria-hidden="true">
            <img src="assets/jrc-shirt-front.jpeg" alt="JRC logo on the front of a shirt">
          </div>
          <div class="design-slide" data-slide aria-hidden="true">
            <img src="assets/jrc-shirt-back.jpeg" alt="JRC lettering on the back of a shirt">
          </div>
        </div>

        <button class="design-slider-arrow design-slider-next" type="button" aria-label="Next image">›</button>

        <div class="design-slider-dots" aria-label="Choose JRC slide">
          <button class="design-slider-dot is-active" type="button" aria-label="Show slide 1" aria-current="true"></button>
          <button class="design-slider-dot" type="button" aria-label="Show slide 2" aria-current="false"></button>
          <button class="design-slider-dot" type="button" aria-label="Show slide 3" aria-current="false"></button>
        </div>
      </div>
    </div>

    <div class="design-slider design-slider-wide design-slider-swipe" data-slider data-slider-mode="slide" tabindex="0" aria-roledescription="carousel" aria-label="Majestic magazine design images">
      <button class="design-slider-arrow design-slider-prev" type="button" aria-label="Previous image">‹</button>

      <div class="design-slider-viewport">
        <div class="design-slide-track">
          <div class="design-slide" data-slide aria-hidden="false">
            <img src="assets/majestic-cover.png" alt="Majestic magazine cover featuring a bear">
          </div>
          <div class="design-slide" data-slide aria-hidden="true">
            <img src="assets/majestic-nature-black-bears.png" alt="Majestic magazine spread about the nature of black bears">
          </div>
          <div class="design-slide" data-slide aria-hidden="true">
            <img src="assets/majestic-lynn-rogers.png" alt="Majestic magazine spread about Lynn Rogers">
          </div>
          <div class="design-slide" data-slide aria-hidden="true">
            <img src="assets/majestic-wesley-larson.png" alt="Majestic magazine spread about Wesley Larson">
          </div>
          <div class="design-slide" data-slide aria-hidden="true">
            <img src="assets/majestic-grizzlies.png" alt="Majestic magazine spread about grizzlies on the move">
          </div>
        </div>
      </div>

      <button class="design-slider-arrow design-slider-next" type="button" aria-label="Next image">›</button>

      <div class="design-slider-dots" aria-label="Choose Majestic magazine slide">
        <button class="design-slider-dot is-active" type="button" aria-label="Show slide 1" aria-current="true"></button>
        <button class="design-slider-dot" type="button" aria-label="Show slide 2" aria-current="false"></button>
        <button class="design-slider-dot" type="button" aria-label="Show slide 3" aria-current="false"></button>
        <button class="design-slider-dot" type="button" aria-label="Show slide 4" aria-current="false"></button>
        <button class="design-slider-dot" type="button" aria-label="Show slide 5" aria-current="false"></button>
      </div>
    </div>

    <div class="design-slider design-slider-wide design-slider-swipe specimen-slider" data-slider data-slider-mode="slide" tabindex="0" aria-roledescription="carousel" aria-label="Akkurat specimen guide images">
      <button class="design-slider-arrow design-slider-prev" type="button" aria-label="Previous image">‹</button>

      <div class="design-slider-viewport">
        <div class="design-slide-track">
          <div class="design-slide" data-slide aria-hidden="false">
            <img src="assets/specimen-guide-cover.png" alt="Akkurat specimen guide cover">
          </div>
          <div class="design-slide" data-slide aria-hidden="true">
            <img src="assets/specimen-guide-1.png" alt="Akkurat specimen guide spread 1">
          </div>
          <div class="design-slide" data-slide aria-hidden="true">
            <img src="assets/specimen-guide-2.png" alt="Akkurat specimen guide spread 2">
          </div>
          <div class="design-slide" data-slide aria-hidden="true">
            <img src="assets/specimen-guide-4.png" alt="Akkurat specimen guide spread 3">
          </div>
          <div class="design-slide" data-slide aria-hidden="true">
            <img src="assets/specimen-guide-6.png" alt="Akkurat specimen guide spread 4">
          </div>
          <div class="design-slide" data-slide aria-hidden="true">
            <img src="assets/specimen-guide-7.png" alt="Akkurat specimen guide spread 5">
          </div>
          <div class="design-slide" data-slide aria-hidden="true">
            <img src="assets/specimen-guide-back.png" alt="Akkurat specimen guide back cover">
          </div>
        </div>
      </div>

      <button class="design-slider-arrow design-slider-next" type="button" aria-label="Next image">›</button>

      <div class="design-slider-dots" aria-label="Choose Akkurat specimen guide slide">
        <button class="design-slider-dot is-active" type="button" aria-label="Show slide 1" aria-current="true"></button>
        <button class="design-slider-dot" type="button" aria-label="Show slide 2" aria-current="false"></button>
        <button class="design-slider-dot" type="button" aria-label="Show slide 3" aria-current="false"></button>
        <button class="design-slider-dot" type="button" aria-label="Show slide 4" aria-current="false"></button>
        <button class="design-slider-dot" type="button" aria-label="Show slide 5" aria-current="false"></button>
        <button class="design-slider-dot" type="button" aria-label="Show slide 6" aria-current="false"></button>
        <button class="design-slider-dot" type="button" aria-label="Show slide 7" aria-current="false"></button>
      </div>
    </div>

    <div class="design-slider design-slider-wide design-slider-swipe psyched-slider" data-slider data-slider-mode="slide" tabindex="0" aria-roledescription="carousel" aria-label="Psyched to Move flyer and pamphlet designs">
      <button class="design-slider-arrow design-slider-prev" type="button" aria-label="Previous group">‹</button>

      <div class="design-slider-viewport">
        <div class="design-slide-track">
          <div class="design-slide psyched-slide-page" data-slide aria-hidden="false">
            <div class="psyched-slide-grid psyched-slide-grid-three">
              <img src="assets/psyched-event-flyer.jpeg" alt="Psyched to Move first annual fundraiser event flyer">
              <img src="assets/psyched-volunteers-needed.jpeg" alt="Psyched to Move volunteers needed flyer">
              <img src="assets/psyched-partners-sponsors.jpeg" alt="Psyched to Move partners and sponsors flyer">
            </div>
          </div>
          <div class="design-slide psyched-slide-page" data-slide aria-hidden="true">
            <div class="psyched-slide-grid psyched-slide-grid-two">
              <img src="assets/psyched-pamphlet-front.png" alt="Psyched to Move pamphlet outside panels">
              <img src="assets/psyched-pamphlet-back.png" alt="Psyched to Move pamphlet inside panels">
            </div>
          </div>
        </div>
      </div>

      <button class="design-slider-arrow design-slider-next" type="button" aria-label="Next group">›</button>

      <div class="design-slider-dots" aria-label="Choose Psyched to Move group">
        <button class="design-slider-dot is-active" type="button" aria-label="Show flyers" aria-current="true"></button>
        <button class="design-slider-dot" type="button" aria-label="Show pamphlets" aria-current="false"></button>
      </div>
    </div>
    <div class="design-slider design-slider-wide design-slider-swipe psyched-slider psyched-slider-mobile" data-slider data-slider-mode="slide" tabindex="0" aria-roledescription="carousel" aria-label="Psyched to Move designs mobile gallery">
      <button class="design-slider-arrow design-slider-prev" type="button" aria-label="Previous image">‹</button>

      <div class="design-slider-viewport">
        <div class="design-slide-track">
          <div class="design-slide" data-slide aria-hidden="false">
            <img src="assets/psyched-event-flyer.jpeg" alt="Psyched to Move first annual fundraiser event flyer">
          </div>
          <div class="design-slide" data-slide aria-hidden="true">
            <img src="assets/psyched-volunteers-needed.jpeg" alt="Psyched to Move volunteers needed flyer">
          </div>
          <div class="design-slide" data-slide aria-hidden="true">
            <img src="assets/psyched-partners-sponsors.jpeg" alt="Psyched to Move partners and sponsors flyer">
          </div>
          <div class="design-slide" data-slide aria-hidden="true">
            <img src="assets/psyched-pamphlet-front.png" alt="Psyched to Move pamphlet outside panels">
          </div>
          <div class="design-slide" data-slide aria-hidden="true">
            <img src="assets/psyched-pamphlet-back.png" alt="Psyched to Move pamphlet inside panels">
          </div>
        </div>
      </div>

      <button class="design-slider-arrow design-slider-next" type="button" aria-label="Next image">›</button>

      <div class="design-slider-dots" aria-label="Choose Psyched to Move image">
        <button class="design-slider-dot is-active" type="button" aria-label="Show image 1" aria-current="true"></button>
        <button class="design-slider-dot" type="button" aria-label="Show image 2" aria-current="false"></button>
        <button class="design-slider-dot" type="button" aria-label="Show image 3" aria-current="false"></button>
        <button class="design-slider-dot" type="button" aria-label="Show image 4" aria-current="false"></button>
        <button class="design-slider-dot" type="button" aria-label="Show image 5" aria-current="false"></button>
      </div>
    </div>


  </section>
</main>

<footer>© <span id="year"></span> Annie Koo</footer>
<script src="script.js"></script>
</body>
</html>
